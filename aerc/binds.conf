# ============================================================
# aerc vim-style bindings (FIXED)
# ============================================================

# -----------------
# GLOBAL BINDINGS
# (must be BEFORE any [section])
# -----------------
F12 = :version<Enter>
<tab> = :next-tab<Enter>
<backtab> = :prev-tab<Enter>
gt = :next-tab<Enter>
gT = :prev-tab<Enter>
ZZ = :quit<Enter>

<C-t> = :term<Enter>
? = :help keys<Enter>

# ============================================================
# MAILBOX / FOLDER LIST (LEFT SIDEBAR)
# ============================================================

[folders]
j = :next-folder<Enter>
k = :prev-folder<Enter>
<Enter> = :open<Enter>

[dirlist]
j = :next-folder<Enter>
k = :prev-folder<Enter>
<Enter> = :open<Enter>

# ============================================================
# MESSAGE LIST
# ============================================================

[messages]
j = :next<Enter>
k = :prev<Enter>
gg = :select 0<Enter>
G = :select -1<Enter>
<Enter> = :view<Enter>

dd = :delete<Enter>
A = :archive flat<Enter>
tr = :read -t<Enter>
s = :sort date<Enter>

J = :next-folder<Enter>
K = :prev-folder<Enter>

# ============================================================
# MESSAGE VIEWER
# ============================================================

[view]
j = :next-line<Enter>
k = :prev-line<Enter>
<C-d> = :next 50%<Enter>
<C-u> = :prev 50%<Enter>
q = :close<Enter>
h = :close<Enter>

# ============================================================
# COMPOSE
# ============================================================

[compose]
<tab> = :next-field<Enter>
<backtab> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-k> = :prev-field<Enter>
<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>

[compose::review]
w = :send<Enter>
s = :send<Enter>
q = :abort<Enter>
ZZ = :abort<Enter>

# ============================================================
# TERMINAL
# ============================================================

[terminal]
<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>

