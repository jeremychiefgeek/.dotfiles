general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 150                                             # 2.5min
    on-timeout = pidof hyprlock # start screensaver (if we haven't locked already)
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/dpms-smart.sh off
    on-resume = ~/.config/hypr/scripts/dpms-smart.sh on && brightnessctl -r
}

