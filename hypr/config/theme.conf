#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#
###                                                               AESTHETICS                                                                      ###
#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#

# name: Rosé Pine
# author: jishnurajendran
# upstream: https://github.com/jishnurajendran/hyprland-rosepine/blob/main/rose-pine.conf
# All natural pine, faux fur and a bit of soho vibes for the classy minimalist
$base           = 0xff191724
$surface        = 0xff1f1d2e
$overlay        = 0xff26233a
$muted          = 0xff6e6a86
$subtle         = 0xff908caa
$text           = 0xffe0def4
$love           = 0xffeb6f92
$gold           = 0xfff6c177
$rose           = 0xffebbcba
$pine           = 0xff31748f
$foam           = 0xff9ccfd8
$iris           = 0xffc4a7e7
$highlightLow   = 0xff21202e
$highlightMed   = 0xff403d52
$highlightHigh  = 0xff524f67

# Set your border color scheme in the file path below.
# (you can remove this source if you're fully inlining theme vars)
# source = $HOME/.config/hypr/aoNIX-eco/lib/control/border-agent.themevars

# Compline-based border colors:
$selection        = rgba(9CCFD8FF)  # active border: Rosé Pine foam
$second_selection = rgba(403D52FF)  # inactive border: Rosé Pine highlightMed

$master_orientation = center  # center/left/right/top/bottom
$rounding = 10
$active_opacity = 0.95 
$inactive_opacity = 0.75
$gaps_in = 5
$gaps_out = 5
$border_size = 3

# Shadow using Rosé Pine overlay with the same alpha (CC)
$shadow_color = rgba(26233ACC)
$shadow_range = 4
$shadow_render_power = 3
$shadow_scale = 1

$blur_size = 1
$blur_passes = 1

#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#
#----!!!!!!!-----------------------------------------------NOOBS DO NOT MODIFY---------------------------------------------------------!!!!!!!------#
#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2.34, almostLinear, slide
    animation = workspacesIn, 1, 2.34, almostLinear, slide
    animation = workspacesOut, 1, 2.34, almostLinear, slidevert
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

general {
    gaps_in = $gaps_in
    gaps_out = $gaps_out
    border_size = $border_size

    col.active_border   = $selection
    col.inactive_border = $second_selection

    resize_on_border = true
    allow_tearing = false
    layout = master
}

master {
    allow_small_split = true
    special_scale_factor = 1
    mfact = 0.55
    new_status = slave
    new_on_top = false
    new_on_active = none
    orientation = $master_orientation
    inherit_fullscreen = true
    smart_resizing = true
    drop_at_cursor = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

decoration {
    shadow {
        enabled = true
        range = $shadow_range
        render_power = $shadow_render_power
        color = $shadow_color
        scale = $shadow_scale
    }

    rounding = $rounding

    active_opacity = $active_opacity
    inactive_opacity = $inactive_opacity

    blur {
        enabled = true
        size = $blur_size
        passes = $blur_passes
        vibrancy = 0.20
    }
}

