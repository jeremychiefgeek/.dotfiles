#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#
###                                                               AESTHETICS                                                                      ###
#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#

# Compline palette (dark)
# bg        = #1a1d21
# bg-alt    = #22262b
# base0     = #0f1114
# base4     = #3d424a
# base8     = #e0dcd4
# fg        = #f0efeb
# red       = #cdacac
# orange    = #ccc4b4
# green     = #b8c4b8
# blue      = #b4bcc4
# cyan      = #b4c0c8
# yellow    = #d4ccb4
# teal      = #b4c4bc
# dark-cyan = #98a4ac

# Set your border color scheme in the file path below.
# (you can remove this source if you're fully inlining theme vars)
# source = $HOME/.config/hypr/aoNIX-eco/lib/control/border-agent.themevars

# Compline-based border colors:
$selection        = rgba(B4C0C8FF)  # active border: compline cyan
$second_selection = rgba(3D424AFF)  # inactive border: compline base4

$master_orientation = center  # center/left/right/top/bottom
$rounding = 0
$active_opacity = 0.95 
$inactive_opacity = 0.75
$gaps_in = 5
$gaps_out = 5
$border_size = 3

# Shadow using compline base0 with same alpha as original (CC)
$shadow_color = rgba(0F1114CC)
$shadow_range = 4
$shadow_render_power = 3
$shadow_scale = 1

$blur_size = 1
$blur_passes = 1

#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#
#----!!!!!!!-----------------------------------------------NOOBS DO NOT MODIFY---------------------------------------------------------!!!!!!!------#
#/||---------------------------------------------------------------------------------------------------------------------------------------------||\#

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2.34, almostLinear, slide
    animation = workspacesIn, 1, 2.34, almostLinear, slide
    animation = workspacesOut, 1, 2.34, almostLinear, slidevert
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

general {
    gaps_in = $gaps_in
    gaps_out = $gaps_out
    border_size = $border_size

    col.active_border   = $selection
    col.inactive_border = $second_selection

    resize_on_border = true
    allow_tearing = false
    layout = master
}

master {
    allow_small_split = true
    special_scale_factor = 1
    mfact = 0.55
    new_status = slave
    new_on_top = false
    new_on_active = none
    orientation = $master_orientation
    inherit_fullscreen = true
    smart_resizing = true
    drop_at_cursor = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

decoration {
    shadow {
        enabled = true
        range = $shadow_range
        render_power = $shadow_render_power
        color = $shadow_color
        scale = $shadow_scale
    }

    rounding = $rounding

    active_opacity = $active_opacity
    inactive_opacity = $inactive_opacity

    blur {
        enabled = true
        size = $blur_size
        passes = $blur_passes
        vibrancy = 0.20
    }
}

